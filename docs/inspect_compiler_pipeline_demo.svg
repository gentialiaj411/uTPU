<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">uTPU compiler pipeline terminal preview</title>
  <desc id="desc">Terminal preview of python examples/inspect_compiler_pipeline.py showing FX import, Graph IR passes, CUDA lowering, and uTPU instruction footprint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="55%" stop-color="#16302f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="980" height="560" fill="url(#bg)"/>
  <circle cx="840" cy="100" r="150" fill="#f6c453" opacity="0.12"/>
  <circle cx="120" cy="470" r="210" fill="#35d0a2" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="64" y="56" width="852" height="448" rx="18" fill="#080b0e" stroke="#28343e"/>
    <rect x="64" y="56" width="852" height="42" rx="18" fill="#151b22"/>
    <circle cx="93" cy="77" r="7" fill="#ff5f57"/>
    <circle cx="117" cy="77" r="7" fill="#ffbd2e"/>
    <circle cx="141" cy="77" r="7" fill="#28c840"/>
    <text x="480" y="83" fill="#9fb3c8" font-family="Consolas, monospace" font-size="14" text-anchor="middle">20-second compiler inspection</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="18">
      <text x="92" y="130" fill="#35d0a2">$ python examples/inspect_compiler_pipeline.py</text>
      <text x="92" y="174" fill="#e6edf3">Compiler pipeline inspection</text>
      <text x="92" y="204" fill="#9fb3c8">model=TinyIntegerMLP  example_input_shape=[1, 4]</text>
      <text x="92" y="250" fill="#f6c453">FX graph</text>
      <text x="120" y="280" fill="#d0d7de">x -> fc1 -> relu -> fc2 -> output</text>
      <text x="92" y="326" fill="#f6c453">Graph IR ops after passes</text>
      <text x="120" y="356" fill="#d0d7de">linear_relu, linear  |  fallback_ops=[]</text>
      <text x="92" y="402" fill="#f6c453">Backend lowering</text>
      <text x="120" y="432" fill="#d0d7de">CUDA: blocked_fc_int4_kernel executable=True</text>
      <text x="120" y="462" fill="#d0d7de">uTPU: 434 ISA words, all ops fit instruction BRAM</text>
    </g>
  </g>
</svg>
